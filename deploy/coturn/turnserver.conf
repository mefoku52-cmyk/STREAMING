# coturn konfigurácia pre CMEP Streaming WebRTC relay.
# Šablóna — pri nasadení sa z nej generuje finálna /etc/turnserver.conf
# s dosadenými hodnotami (TURN_SECRET sa číta z .env, nie je v tejto šablóne).

# Verejná IP adresa VPS (iba IPv4; pre IPv6 pridajte další riadok listening-ip)
listening-ip=<VPS_PUBLIC_IP>
listening-port=3478
tls-listening-port=5349

# Realm použitý pri TURN autentifikácii (TURN REST API)
realm=<TURN_REALM>

# TURN REST API autentifikácia (časovo obmedzené credentials)
# - use-auth-secret: zapína režim TURN REST (HMAC-SHA1, Base64)
# - static-auth-secret: zdieľaný secret (dosadí deploy script z .env TURN_SECRET)
use-auth-secret
static-auth-secret=<TURN_SECRET>

# Certifikáty pre TURN over TLS (voliteľné, pre WSS/TURN na porte 5349)
# cert=/etc/letsencrypt/live/streaming.cmep.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/streaming.cmep.example.com/privkey.pem

# Povolené protokoly a porty pre relay
min-port=49152
max-port=65535
mtu=1400

# Network
no-loopback-peers
no-multicast-peers

# Logy
verbose
log-file=/var/log/coturn/turnserver.log

# Bezpečnosť: žiadne static user=, žiadny anonymný prístup (fail-closed).
