<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMEP Live Inspection — Publisher</title><link rel="stylesheet" href="/app.css"></head><body><main><h1>Publisher — živá obhliadka</h1>
<section><h2>1. Zariadenia</h2>
<label>Kamera <select id="camSel"></select></label>
<label>Mikrofón <select id="micSel"></select></label>
<p><button id="preview">Náhľad kamery</button> <button id="camToggle" disabled>Kamera: —</button> <button id="micToggle" disabled>Mikrofón: —</button> <button id="stopPreview" disabled>Stop náhľad</button></p>
<p>Stav spojenia: <span id="connState" data-state="new">—</span> · Kamera: <span id="camState">vypnutá</span> · Mikrofón: <span id="micState">vypnutý</span> · Hovor: <span id="callState">neaktívny</span></p>
<video id="local" autoplay playsinline muted></video>
<audio id="remoteAudio" autoplay></audio>
</section>
<section><h2>2. Pripojenie</h2>
<label>Token (dev) <input id="token" autocomplete="off" placeholder="z mint-token.sh alebo z CMEP platformy"></label>
<label>Offer ID <input id="offer" autocomplete="off" placeholder="id ponuky / obhliadky"></label>
<p><button id="start" disabled>Vytvoriť obhliadku (createRoom)</button> <button id="startStream" disabled>Spustiť stream</button> <button id="accept" disabled>Accept — schváliť kupujúceho</button> <button id="stop" disabled>Ukončiť</button></p>
</section>
<pre id="state" role="status">Neaktívny</pre>
<script src="/vendor/mediasoup-client.min.js"></script>
<script src="/rpc.js"></script>
<script src="/publish.js" defer></script>
</main></body></html>
